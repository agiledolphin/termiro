# Termino configuration.
# Every field is optional; anything left out uses the value shown here.

[timing]
# How long a direction key must be held before it starts repeating (DAS).
das_ms = 167
# Interval between repeated moves once repeating (ARR). 0 = jump to the wall.
arr_ms = 33
# Interval between rows while soft drop is held. 0 = drop to the floor.
soft_drop_ms = 33

# Each action takes a list of keys.
# Key names: Left, Right, Up, Down, Space, Enter, Tab, Backspace, Esc,
# or any single character (letters are case-insensitive).
# Ctrl-C always quits.
[keys]
move_left = ["Left"]
move_right = ["Right"]
soft_drop = ["Down"]
hard_drop = ["Space"]
rotate_cw = ["Up", "x"]
rotate_ccw = ["z"]
hold = ["c"]
pause = ["p"]
restart = ["r"]
quit = ["q", "Esc"]

[display]
# Color support: auto, truecolor, 256, 16 or none.
# auto looks at the NO_COLOR, COLORTERM and TERM environment variables.
# With none, blocks are drawn as [] instead of colored cells.
color = "auto"
# Draw borders with plain ASCII (+ - |). Turn this on if borders look broken,
# e.g. when the terminal treats box-drawing characters as double width.
ascii = false

# A small surprise on the title screen.
[birthday]
# Name to show with it. Leave empty for none.
name = ""
# Play music with it.
sound = true
